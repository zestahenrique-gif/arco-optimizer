name: Gerar Arco Optimizer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --noconsole --onefile --name ArcoOptimizer ArcoOptimizer.py
      - uses: actions/upload-artifact@v4
        with:
          name: ArcoOptimizer-Windows
          path: dist/ArcoOptimizer.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ArcoOptimizer.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --windowed --name "Arco Optimizer" ArcoOptimizer.py
      - run: ditto -c -k --keepParent "dist/Arco Optimizer.app" ArcoOptimizer-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ArcoOptimizer-macOS
          path: ArcoOptimizer-macOS.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ArcoOptimizer-macOS.zip
